[project]
name = "foreman"
version = "0.1.0"
description = "honcho.dev rebuild on the Databricks stack."
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.81.0",
    "databricks-vectorsearch>=0.59",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "openai>=1.60",
    "mlflow>=3.0",
    "fastapi-pagination>=0.12",
    "nanoid>=2.0",
    "structlog>=24.4",
    "mcp[cli]>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.13",
    "build>=1.0",
]
jobs = [
    "pyspark>=3.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires deployed bundle / external services; skipped in unit runs",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
